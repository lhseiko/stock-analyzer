            { l: '平量大涨', d: '平量大涨冲上沿；无增量资金的箱体内脉冲，反弹结束继续下行' },
            { l: '平量下跌', d: '成交平稳小幅下行；箱体内部消耗，空头依旧占据主动' },

            { l: '放量滞涨', d: '放量冲过上沿但是站不住；典型诱多，资金借机出货' },
            { l: '放量滞跌', d: '放量打下下沿收回；短暂抵抗，支撑虚假，后续破位概率高' }
          ] },
          { t: '量价背离', children: [
            { l: '底背离', d: '股价创新低，成交量不再创新低；仅代表反弹机会，下跌趋势大概率不会反转' },
            { l: '顶背离', d: '反弹新高量能跟不上；反弹衰竭信号，反弹结束继续下行' }
          ] },
          { t: '极端量能（天量/地量）', children: [
            { l: '天量', d: '下跌途中天量下跌，恐慌集中释放，加速赶底' },
            { l: '地量', d: '下跌途中地量下跌，阴跌无底，短期很难企稳' }
          ] }
        ] }
      ]
    };

    // ---------- 布局常量（x：各层左缘；宽度决定换行估算） ----------
    var X = { root: 16, branch: 250, group: 590, leaf: 850 };
    var W = { root: 170, branch: 285, group: 200, leaf: 360 };
    var GAP_LEAF = 8, GAP_GROUP = 22, GAP_BRANCH = 40;
    var PAD_R = 24, PAD_B = 24;

    var canvas = document.getElementById('vmCanvas');
    var viewport = document.getElementById('vmViewport');
    var nodes = [];   // [{el, x, y, w, h, color, type, node}]
    var edges = [];   // [{parent, child}]
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    canvas.appendChild(svg);

    // ---------- 文本换行估算（中文字宽 ≈ font-size，守卫无需 DOM 测量） ----------
    function lines(text, inner, fs) {
      var per = Math.max(4, Math.floor(inner / fs));
      return Math.max(1, Math.ceil(text.length / per));
    }
    function spanH(node, depth) {
      if (node.l !== undefined) { // 叶子
        var text = node.l + '：' + node.d;
        var n = lines(text, W.leaf - 20, 12);
        node._h = 14 + n * 18.5;
        node._span = node._h;
        return;
      }
      var kids = node.children || [];
      var sum = 0, gap = depth === 2 ? GAP_LEAF : (depth === 1 ? GAP_GROUP : GAP_BRANCH);
      for (var i = 0; i < kids.length; i++) { spanH(kids[i], depth + 1); sum += kids[i]._span; }
      if (kids.length) sum += gap * (kids.length - 1);
      if (depth === 0) {
        node._h = 20 + lines(node.t, W.root - 28, 16) * 24;
      } else if (depth === 1) {
        node._h = 18 + lines(node.t, W.branch - 24, 14) * 21;
      } else {
        node._h = 14 + lines(node.t, W.group - 25, 13) * 19;
      }
      node._span = kids.length && !node._collapsed ? Math.max(sum, node._h) : node._h;
    }
    function layout(node, depth, x, y) {
      node._x = x; node._y = y + (node._span - node._h) / 2;
      var kids = node.children || [];
      if (!kids.length || node._collapsed) { node._open = false; return; }
      node._open = true;
      var cy = y, gap = depth === 2 ? GAP_LEAF : (depth === 1 ? GAP_GROUP : GAP_BRANCH);
      for (var i = 0; i < kids.length; i++) { layout(kids[i], depth + 1, x + node._w, cy); cy += kids[i]._span + gap; }
      node._w = node._w; // noop keep
    }

    // 布局前补宽度（root/branch/group/leaf）
    function setW(node, depth) {
      if (node.l !== undefined) node._w = W.leaf;
      else if (depth === 0) node._w = W.root;
      else if (depth === 1) node._w = W.branch;
      else node._w = W.group;
      (node.children || []).forEach(function (c) { setW(c, depth + 1); });
    }

    // ---------- 构建 DOM（一次创建，重排版只改位置/显隐） ----------
    function build(node, depth, color) {
      var el = document.createElement('div');
      var type = node.l !== undefined ? 'leaf' : (depth === 0 ? 'root' : (depth === 1 ? 'branch' : 'group'));
      el.className = 'vm-node vm-' + type;
      if (type === 'leaf') {
        el.innerHTML = '<b style="color:' + color + '">' + node.l + '：</b>' + node.d;
      } else if (type === 'root') {
        el.textContent = node.t;
      } else {
        el.innerHTML = '<span class="vm-fold"></span>' + node.t;
        if (type === 'branch') { el.style.color = node.color; el.style.borderColor = node.color; el.style.background = hex8(node.color, 0.1); }
        else { el.style.borderLeftColor = color; el.style.color = color; }
        el.title = '点击折叠/展开';
      }
      node._el = el; node._type = type; node._color = color;
      canvas.appendChild(el);
      nodes.push(node);
      var kids = node.children || [];
      for (var i = 0; i < kids.length; i++) { edges.push({ p: node, c: kids[i] }); build(kids[i], depth + 1, type === 'root' ? kids[i].color : color); }
    }
    function hex8(hex, a) {
      var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }

    // ---------- 渲染（每次折叠/展开后重算位置与连线） ----------
    function render() {
      setW(DATA, 0);
      spanH(DATA, 0);
      layout(DATA, 0, X.root, 0);
      var ch = DATA._span + PAD_B, cw = X.leaf + W.leaf + PAD_R;
      canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
      svg.setAttribute('width', cw); svg.setAttribute('height', ch);
      var paths = [];
      nodes.forEach(function (n) {
        var vis = true, a = n;
        while (a) { if (a._collapsed && a !== n) { vis = false; break; } a = a._parent; }
        n._el.style.display = vis ? '' : 'none';
        if (!vis) return;
        n._el.style.left = n._x + 'px'; n._el.style.top = n._y + 'px';
        n._el.style.width = n._w + 'px'; n._el.style.minHeight = n._h + 'px';
        var fold = n._el.querySelector('.vm-fold');
        if (fold && n._type !== 'leaf') fold.textContent = (n._collapsed ? '▸ ' : '▾ ');
      });
      edges.forEach(function (e) {
        var vis = true, a = e.c;
        while (a) { if (a._collapsed) { vis = false; break; } a = a._parent; }
        if (!vis) return;
        var x1 = e.p._x + e.p._w, y1 = e.p._y + e.p._h / 2, x2 = e.c._x, y2 = e.c._y + e.c._h / 2;
        var dx = Math.max(30, (x2 - x1) * 0.5);
        paths.push('<path d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2 +
          '" fill="none" stroke="' + (e.c.color || e.p._color || '#F0B97B') + '" stroke-opacity="0.55" stroke-width="' +
          (e.c.l !== undefined ? 1.4 : 2.2) + '"/>');
      });
      svg.innerHTML = paths.join('');
    }
    // 补父指针
    function linkParent(node) { (node.children || []).forEach(function (c) { c._parent = node; c.color = c.color || node.color; linkParent(c); }); }
    linkParent(DATA);
    build(DATA, 0, null);
    render();

    // ---------- 折叠交互 ----------
    canvas.addEventListener('click', function (ev) {
      if (moved) return;
      var el = ev.target.closest('.vm-branch, .vm-group');
      if (!el) return;
      var n = null;
      for (var i = 0; i < nodes.length; i++) if (nodes[i]._el === el) { n = nodes[i]; break; }
      if (!n || !n.children || !n.children.length) return;
      n._collapsed = !n._collapsed;
      render();
    });

    // ---------- 平移 + 缩放 ----------
    var view = { x: 0, y: 0, s: 1 }, moved = false;
    function apply() { canvas.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')'; }
    function fit() {
      // 20261102f：留白 32→20（配合页面放宽），缩放上限仍为 1（100% 字号清晰，不放大）
      var cw = X.leaf + W.leaf + PAD_R, chh = DATA._span + PAD_B;
      var vw = viewport.clientWidth, vh = viewport.clientHeight;
      view.s = Math.min((vw - 20) / cw, (vh - 20) / chh, 1);
      view.x = (vw - cw * view.s) / 2; view.y = (vh - chh * view.s) / 2;
      apply();
    }
    viewport.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var r = viewport.getBoundingClientRect();
      var mx = ev.clientX - r.left, my = ev.clientY - r.top;
      var k = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
      var ns = Math.min(2.5, Math.max(0.12, view.s * k));
      view.x = mx - (mx - view.x) * (ns / view.s);
      view.y = my - (my - view.y) * (ns / view.s);
      view.s = ns; apply();
    }, { passive: false });
    var drag = null;
    viewport.addEventListener('pointerdown', function (ev) {
      drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y }; moved = false;
      viewport.classList.add('dragging');
    });
    window.addEventListener('pointermove', function (ev) {
      if (!drag) return;
      var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
    });
    window.addEventListener('pointerup', function () { drag = null; viewport.classList.remove('dragging'); setTimeout(function () { moved = false; }, 0); });

    document.getElementById('vmFit').onclick = fit;
    document.getElementById('vmReset').onclick = function () { view = { x: 12, y: 12, s: 1 }; apply(); };
    document.getElementById('vmExpand').onclick = function () { nodes.forEach(function (n) { n._collapsed = false; }); render(); };
    document.getElementById('vmCollapse').onclick = function () { nodes.forEach(function (n) { if (n._type === 'group') n._collapsed = true; }); render(); };

    fit();
  })();
